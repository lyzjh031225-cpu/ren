<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Portal - 登录注册</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <section id="auth-view">
        <h1>账号门户</h1>
        <p class="hint">请先注册账号，再使用账号密码登录。</p>

        <div class="tab-row" role="tablist" aria-label="登录与注册切换">
          <button id="tab-login" class="tab active" type="button" role="tab" aria-selected="true">登录</button>
          <button id="tab-register" class="tab" type="button" role="tab" aria-selected="false">注册</button>
        </div>

        <p id="auth-message" class="message" aria-live="polite"></p>

        <form id="login-form" class="panel">
          <label>
            账号
            <input id="login-username" type="text" maxlength="40" placeholder="请输入账号" required />
          </label>
          <label>
            密码
            <input id="login-password" type="password" maxlength="64" placeholder="请输入密码" required />
          </label>
          <button type="submit">登录</button>
        </form>

        <form id="register-form" class="panel hidden">
          <label>
            新账号
            <input id="register-username" type="text" maxlength="40" placeholder="请输入新账号" required />
          </label>
          <label>
            新密码
            <input id="register-password" type="password" maxlength="64" placeholder="请输入新密码" required />
          </label>
          <label>
            确认密码
            <input id="register-confirm" type="password" maxlength="64" placeholder="请再次输入密码" required />
          </label>
          <button type="submit">注册</button>
        </form>
      </section>

      <section id="portal-view" class="hidden" aria-live="polite">
        <h1>欢迎进入门户</h1>
        <p id="welcome-text"></p>
        <p class="hint">当前为本地演示：账号信息仅保存在浏览器本地存储。</p>
        <button id="logout-btn" type="button" class="secondary">退出登录</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
