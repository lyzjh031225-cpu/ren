<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Portal</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <h1>从零搭建成功 ✅</h1>
      <p class="desc">这是你的扩展起步页，后续功能可以在此基础上继续迭代。</p>

      <section class="card">
        <p class="label">按钮点击次数</p>
        <p id="count" class="count">0</p>
        <button id="increment-btn" type="button">点击 +1</button>
      </section>

      <p class="hint">计数会保存在本地存储，关闭弹窗后仍会保留。</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
