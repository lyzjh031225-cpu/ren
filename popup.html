<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Notes - 登录门户</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <section id="login-view">
        <h1>登录门户</h1>
        <p class="hint">登录后可进入插件门户。</p>
        <form id="login-form">
          <label>
            用户名
            <input id="username" type="text" maxlength="40" placeholder="请输入用户名" required />
          </label>
          <label>
            密码
            <input id="password" type="password" maxlength="64" placeholder="请输入密码" required />
          </label>
          <button type="submit">登录</button>
        </form>
      </section>

      <section id="portal-view" class="hidden" aria-live="polite">
        <h1>欢迎进入门户</h1>
        <p id="welcome-text"></p>
        <p class="hint">当前是本地演示登录状态，不会连接远程服务器。</p>
        <button id="logout-btn" type="button" class="secondary">退出登录</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
